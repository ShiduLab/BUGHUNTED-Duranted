name: Diagnose Paperi images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-paperi-images.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect suspect image payloads
        run: |
          for f in assets/01-gods-eye-pinokio-home.webp \
                   assets/02-gods-eye-app-page.webp \
                   assets/03-05-installation-sequence.webp \
                   assets/06-13-eye-exploration-sequence.webp; do
            echo "===== $f ====="
            wc -c "$f"
            file "$f" || true
            echo "HEX:"
            xxd -l 64 "$f" || true
            echo "ASCII HEAD:"
            head -c 120 "$f" | cat -v || true
            echo
          done
